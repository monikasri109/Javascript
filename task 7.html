<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mission Tracker</title>
  <link rel="stylesheet" href="task 7.css">
</head>
<body>
  <h1>Campus Quest</h1>
  <p>Small steps. Big goals!</p>
  <button id="changeColorButton">Change Color</button>

  <h2>Add a Mission</h2>
  <input id="missionInput" type="text" placeholder="Enter a mission">
  <button id="addButton">Add Mission</button>
  <p>Total missions: <span id="missionCount">0</span></p>

    <li>Solve 5 LeetCode Questions</li>
    <li>Help a Junior</li>
    <li>Complete Mini Project</li>
    <li>Join a Club Activity</li>
  </ul>

  <script src="task 7.js"></script>
</body>
</html>
